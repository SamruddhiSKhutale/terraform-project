{% extends "base.html" %}
{% block title %}{{ 'Edit Task' if task else 'New Task' }}{% endblock %}

{% block content %}
<div class="container-fluid px-4 py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card-modern">
                <div class="card-header">
                    <span>
                        <i class="bi bi-{{ 'pencil-square' if task else 'plus-square' }} me-2 text-primary"></i>
                        {{ 'Edit Task' if task else 'Create New Task' }}
                        <small class="text-muted ms-2">in {{ project.name }}</small>
                    </span>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Task Title *</label>
                            <input type="text" name="title" class="form-control" 
                                   value="{{ task.title if task else '' }}" 
                                   placeholder="What needs to be done?" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea name="description" class="form-control" rows="3" 
                                      placeholder="Add more details...">{{ task.description if task else '' }}</textarea>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Priority</label>
                                <select name="priority" class="form-select">
                                    <option value="low" {% if task and task.priority == 'low' %}selected{% endif %}>Low</option>
                                    <option value="medium" {% if not task or task.priority == 'medium' %}selected{% endif %}>Medium</option>
                                    <option value="high" {% if task and task.priority == 'high' %}selected{% endif %}>High</option>
                                    <option value="critical" {% if task and task.priority == 'critical' %}selected{% endif %}>Critical</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Status</label>
                                <select name="status" class="form-select">
                                    <option value="todo" {% if not task or task.status == 'todo' %}selected{% endif %}>To Do</option>
                                    <option value="in_progress" {% if task and task.status == 'in_progress' %}selected{% endif %}>In Progress</option>
                                    <option value="completed" {% if task and task.status == 'completed' %}selected{% endif %}>Completed</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Due Date</label>
                                <input type="date" name="due_date" class="form-control"
                                       value="{{ task.due_date.strftime('%Y-%m-%d') if task and task.due_date else '' }}">
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>
                                {{ 'Update Task' if task else 'Create Task' }}
                            </button>
                            <a href="{{ url_for('main.project_detail', project_id=project.id) }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
